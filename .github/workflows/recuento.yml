# Recuento nocturno de los picks de la Serie A: cada noche (22:30 Bogotá) trae los resultados del día desde FotMob
# y liquida los picks publicados (docs/serie-a/data/recuento.json → sección Rendimiento de la web).
# Si ese día no hubo partidos no cambia nada y no se publica.
name: Recuento de picks (noche)
on:
  schedule:
    - cron: "30 3 * * *"          # 22:30 en Bogotá (UTC-5)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jornada-serie-a           # la misma que la jornada, para no chocar al publicar
  cancel-in-progress: false
jobs:
  recuento:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Caché de lo crudo de FotMob
        uses: actions/cache@v4
        with:
          path: futbol/serie_a/raw
          key: fotmob-raw-${{ github.run_id }}
          restore-keys: fotmob-raw-
      - name: Resultados del día (FotMob)
        continue-on-error: true
        run: python -m futbol.datos.fotmob historico
      - name: Liquidar picks
        run: python -m futbol.recuento serie_a
      - name: Publicar
        run: |
          git config user.name "ncdata-bot"
          git config user.email "ncdata-bot@users.noreply.github.com"
          git add futbol/serie_a/historico futbol/serie_a/recuento docs/serie-a/data/recuento.json docs/serie-a/data/resultados.json
          if git diff --cached --quiet -- futbol/serie_a/recuento futbol/serie_a/historico; then echo "Sin resultados nuevos"; exit 0; fi
          git commit -m "Recuento de picks de la Serie A ($(date -u +%Y-%m-%d))"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
