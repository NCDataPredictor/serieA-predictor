name: Sondeo fuentes (temporal)
on:
  push:
    branches: [sondeo-fuentes]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Mercados Kambi y Pinnacle
        shell: python
        run: |
          import json, urllib.request, collections
          K="lang=en_GB&market=CO&client_id=2&channel_id=1&includeParticipants=true"
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30))
          for op in ("rsico","betplay"):
              lv=get(f"https://us1.offering-api.kambicdn.com/offering/v2018/{op}/listView/football/italy/serie_a/all/matches.json?{K}")
              ev=lv["events"][0]["event"]; print(op, len(lv["events"]), "partidos; ejemplo", ev["name"])
              bo=get(f"https://us1.offering-api.kambicdn.com/offering/v2018/{op}/betoffer/event/{ev['id']}.json?{K}")
              c=collections.Counter(b["criterion"]["englishLabel"] for b in bo["betOffers"])
              print(" ", len(bo["betOffers"]), "ofertas,", len(c), "mercados")
              for k,v in sorted(c.items()): print("   ", v, k)
          m=get("https://guest.api.arcadia.pinnacle.com/0.1/leagues/2436/matchups")
          print("Pinnacle", len(m), "matchups; tipos:", collections.Counter(x.get("type") for x in m).most_common(5))
          print("Pinnacle props ej:", [x.get("special",{}).get("description") for x in m if x.get("type")=="special"][:15])
