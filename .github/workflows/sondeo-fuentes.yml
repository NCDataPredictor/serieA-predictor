name: Sondeo fuentes (temporal)
on:
  push:
    branches: [sondeo-fuentes]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Probar fuentes
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          probe() { code=$(curl -s -o /tmp/b -w "%{http_code}" -m 20 -A "$UA" -H "Accept: application/json" "$2"); echo "$1 | $code | $(wc -c </tmp/b) bytes | $(head -c 200 /tmp/b | tr '\n' ' ')"; }
          K="lang=en_GB&market=CO&client_id=2&channel_id=1&includeParticipants=true"
          probe "Kambi Rushbet SerieA" "https://us1.offering-api.kambicdn.com/offering/v2018/rsico/listView/football/italy/serie_a/all/matches.json?$K"
          probe "Kambi BetPlay SerieA" "https://us1.offering-api.kambicdn.com/offering/v2018/betplay/listView/football/italy/serie_a/all/matches.json?$K"
          probe "Betano CO" "https://www.betano.co/api/sport/futbol/ligas/1635r/?req=s,stnf,c,mb"
          probe "DraftKings" "https://sportsbook-nash.draftkings.com/api/sportscontent/dkusnj/v1/leagues/13709"
          probe "FanDuel" "https://sbapi.nj.sportsbook.fanduel.com/api/content-managed-page?page=CUSTOM&customPageId=serie-a&_ak=FhMFpcPWXMeyZxOx"
          probe "ESPN scoreboard" "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard"
          probe "ESPN core odds" "https://sports.core.api.espn.com/v2/sports/soccer/leagues/ita.1/events?limit=3"
          probe "Pinnacle guest" "https://guest.api.arcadia.pinnacle.com/0.1/leagues/2436/matchups"
          probe "FotMob league" "https://www.fotmob.com/api/data/leagues?id=55"
          probe "365Scores" "https://webws.365scores.com/web/games/current/?appTypeId=5&langId=29&competitions=17"
          probe "TheOddsAPI" "https://api.the-odds-api.com/v4/sports/"
          probe "API-Football" "https://v3.football.api-sports.io/status"
          probe "IP" "https://ipinfo.io/json"
